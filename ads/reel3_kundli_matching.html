<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>MyRashifal+ Reel - Kundli Matching</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px; height: 1920px;
    background: #060918;
    font-family: 'Inter', sans-serif;
    overflow: hidden; position: relative;
  }

  .stars {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 120px 250px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 450px 400px, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 800px 350px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 300px 950px, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 700px 1300px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 200px 1700px, rgba(255,255,255,0.3), transparent);
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle { 0% { opacity: 0.6; } 100% { opacity: 1; } }

  .glow {
    position: absolute; width: 450px; height: 450px;
    border-radius: 50%; filter: blur(80px); pointer-events: none;
    background: radial-gradient(circle, rgba(201,149,26,0.12), transparent 70%);
    top: 300px; left: 50%; transform: translateX(-50%);
  }

  .content {
    position: relative; z-index: 10;
    display: flex; flex-direction: column; align-items: center;
    height: 100%; padding: 70px 60px;
  }

  .brand {
    align-self: flex-start;
    opacity: 0; animation: fadeIn 0.5s ease 0.2s forwards;
  }
  .brand h2 { font-size: 28px; font-weight: 700; color: #e8bf4b; }

  /* Score ring */
  .score-section {
    margin-top: 100px; text-align: center;
    opacity: 0; animation: fadeIn 0.6s ease 0.5s forwards;
  }

  .score-ring {
    position: relative; width: 280px; height: 280px; margin: 0 auto;
  }
  .score-ring svg {
    width: 280px; height: 280px; transform: rotate(-90deg);
  }
  .ring-bg {
    fill: none; stroke: rgba(138,144,168,0.15); stroke-width: 10;
  }
  .ring-fill {
    fill: none; stroke: #e8bf4b; stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 754; /* 2 * PI * 120 */
    stroke-dashoffset: 754;
    animation: fillRing 2s ease 0.8s forwards;
  }
  @keyframes fillRing {
    to { stroke-dashoffset: 126; } /* 754 - (754 * 30/36) = 754 - 628 = 126 */
  }

  .score-text {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center;
  }
  .score-number {
    font-size: 72px; font-weight: 800; color: #e8bf4b;
    opacity: 0; animation: popIn 0.5s ease 1.5s forwards;
  }
  .score-label {
    font-size: 20px; color: #8a90a8; margin-top: 4px;
    opacity: 0; animation: fadeIn 0.5s ease 1.8s forwards;
  }

  /* Hearts */
  .hearts {
    display: flex; gap: 20px; margin-top: 40px; justify-content: center;
  }
  .heart {
    font-size: 36px; color: rgba(201,149,26,0.5);
    opacity: 0; animation: popIn 0.3s ease forwards;
  }
  .heart:nth-child(1) { animation-delay: 2.0s; }
  .heart:nth-child(2) { animation-delay: 2.1s; color: rgba(201,149,26,0.65); }
  .heart:nth-child(3) { animation-delay: 2.2s; color: rgba(201,149,26,0.8); }
  .heart:nth-child(4) { animation-delay: 2.3s; color: #e8bf4b; }
  .heart:nth-child(5) { animation-delay: 2.4s; color: #e8bf4b; }

  /* Headline */
  .headline {
    text-align: center; margin-top: 60px;
  }
  .headline h1 {
    font-size: 64px; font-weight: 800; color: #fff; line-height: 1.15;
    opacity: 0; animation: slideUp 0.7s ease 2.5s forwards;
  }
  .headline h1 span { color: #e8bf4b; }

  .features {
    margin-top: 30px; text-align: center;
  }
  .feature-line {
    font-size: 22px; color: #8a90a8; line-height: 1.7;
    opacity: 0; animation: fadeIn 0.5s ease forwards;
  }
  .feature-line:nth-child(1) { animation-delay: 2.9s; }
  .feature-line:nth-child(2) { animation-delay: 3.1s; }

  /* Bottom */
  .bottom {
    margin-top: auto; text-align: center; padding-bottom: 80px; width: 100%;
  }
  .cta-btn {
    display: inline-block;
    background: linear-gradient(135deg, #c9951a, #e8bf4b);
    color: #060918; font-size: 30px; font-weight: 700;
    padding: 20px 48px; border-radius: 14px;
    opacity: 0; animation: slideUp 0.6s ease 3.3s forwards;
    box-shadow: 0 6px 24px rgba(201,149,26,0.3);
  }
  .price-badge {
    display: inline-block; margin-top: 16px;
    background: rgba(15,20,45,0.9); border: 1px solid rgba(201,149,26,0.2);
    color: #e8bf4b; font-size: 20px; font-weight: 600;
    padding: 8px 24px; border-radius: 10px;
    opacity: 0; animation: fadeIn 0.5s ease 3.6s forwards;
  }
  .url {
    font-size: 20px; color: #8a90a8; margin-top: 16px;
    opacity: 0; animation: fadeIn 0.5s ease 3.8s forwards;
  }
  .hindi {
    font-size: 22px; color: rgba(138,144,168,0.6); margin-top: 10px;
    opacity: 0; animation: fadeIn 0.5s ease 4s forwards;
  }

  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="glow"></div>

  <div class="content">
    <div class="brand"><h2>MyRashifal+</h2></div>

    <div class="score-section">
      <div class="score-ring">
        <svg viewBox="0 0 280 280">
          <circle class="ring-bg" cx="140" cy="140" r="120" />
          <circle class="ring-fill" cx="140" cy="140" r="120" />
        </svg>
        <div class="score-text">
          <div class="score-number">30/36</div>
          <div class="score-label">Gun Milan Score</div>
        </div>
      </div>

      <div class="hearts">
        <span class="heart">&#9829;</span>
        <span class="heart">&#9829;</span>
        <span class="heart">&#9829;</span>
        <span class="heart">&#9829;</span>
        <span class="heart">&#9829;</span>
      </div>
    </div>

    <div class="headline">
      <h1>Kundli Matching<br><span>Before You Say Yes</span></h1>
    </div>

    <div class="features">
      <p class="feature-line">Ashtakoot Gun Milan | 36 Points System</p>
      <p class="feature-line">Manglik Check | Full Compatibility Report</p>
    </div>

    <div class="bottom">
      <div class="cta-btn">Check Compatibility &gt;</div>
      <div class="price-badge">Starting at Rs.79</div>
      <p class="url">myrashifal.in</p>
      <p class="hindi">&#x0915;&#x0941;&#x0902;&#x0921;&#x0932;&#x0940; &#x092E;&#x093F;&#x0932;&#x093E;&#x0928; &mdash; &#x0936;&#x093E;&#x0926;&#x0940; &#x0938;&#x0947; &#x092A;&#x0939;&#x0932;&#x0947; &#x091C;&#x093E;&#x0928;&#x0947;&#x0902;</p>
    </div>
  </div>
</body>
</html>
