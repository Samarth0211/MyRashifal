# Use after Certbot has issued the certificate for both names.
server {
    listen 80;
    server_name myrashifal.in www.myrashifal.in;
    return 301 https://myrashifal.in$request_uri;
}

server {
    listen 443 ssl;
    server_name www.myrashifal.in;
    ssl_certificate /etc/letsencrypt/live/myrashifal.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myrashifal.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://myrashifal.in$request_uri;
}

server {
    listen 443 ssl;
    server_name myrashifal.in;
    ssl_certificate /etc/letsencrypt/live/myrashifal.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myrashifal.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 5m;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
