# Install as a separate site after checking the server's existing proxy configuration.
# This HTTP configuration is for staging and certificate issuance. Enable HTTPS
# with Certbot before directing production traffic here.
server {
    listen 80;
    server_name myrashifal.in www.myrashifal.in;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
